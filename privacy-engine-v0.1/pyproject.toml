[project]
name = "privacy-engine-v0.1"
version = "0.1.0"
description = "Local PII-sanitization service for WatchTower"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "phonenumbers==8.13.0",
    "regex==2023.12.25",
    "structlog==23.2.0",
    "pytest==7.4.3",
    "pydantic==2.5.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
